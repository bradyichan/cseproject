name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

jobs:
  frontend-lint-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend/swap-and-sell-team22
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend/swap-and-sell-team22
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend/swap-and-sell-team22
        run: npm run build
