name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    # If UConn uses their own runners, change to: self-hosted
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (backend only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        run: |
          pylint .

  test:
    # If UConn uses self-hosted runners, change to: self-hosted
    runs-on: ubuntu-latest
    needs: lint
    env:
      PORT: 5001
      BASE_URL: http://127.0.0.1:5001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (backend only)
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask API
        working-directory: ./backend
        run: |
          nohup python main.py > ../api.log 2>&1 &
          for i in {1..30}; do
            if curl -sSf "http://127.0.0.1:${PORT}/health" > /dev/null; then
              echo "API is up."
              break
            fi
            echo "Waiting for API..."
            sleep 1
          done

      - name: Run pytest (REAL HTTP tests)
        run: |
          pytest -q backend/tests -s

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          if-no-files-found: warn
